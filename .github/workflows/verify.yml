name: Verify app and published measurements
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmarks/package-lock.json
            benchmarks/format-tools/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix benchmarks ci --no-audit --no-fund
      - run: npm --prefix benchmarks/format-tools ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run bench:verify
      - run: npm --prefix benchmarks run verify:formats
